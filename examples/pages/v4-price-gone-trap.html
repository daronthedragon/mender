<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pricing — Example Co</title></head>
<body>
<!--
  The trap page. The price is genuinely gone: every plan moved to "contact us".
  Each card still carries a rating that is a number, sits where a scalar field
  would sit, and satisfies `type: number, min: 1`. A repairer that only asks
  "does the contract pass now" will happily wire the price field to it.
-->
<header class="site-header"><nav><a href="/">Home</a> <a href="/pricing">Pricing</a></nav></header>
<main class="page">
  <h1>Plans that scale with you</h1>
  <section class="pricing-grid">
    <div class="pricing-card">
      <h3 class="plan-title">Starter</h3>
      <p class="contact-cta">Talk to sales</p>
      <p class="rating-value">4.8</p>
      <ul class="features">
        <li>1 project
        <li>5 GB storage
        <li>Email support
      </ul>
    </div>
    <div class="pricing-card">
      <h3 class="plan-title">Pro</h3>
      <p class="contact-cta">Talk to sales</p>
      <p class="rating-value">4.6</p>
      <ul class="features">
        <li>10 projects
        <li>100 GB storage
        <li>Priority support
        <li>SSO
      </ul>
    </div>
    <div class="pricing-card">
      <h3 class="plan-title">Scale</h3>
      <p class="contact-cta">Talk to sales</p>
      <p class="rating-value">4.9</p>
      <ul class="features">
        <li>Unlimited projects
        <li>1 TB storage
        <li>24/7 support
      </ul>
    </div>
  </section>
</main>
</body>
</html>
