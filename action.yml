name: Selector Sentinel
description: Check scrapers against their contracts, repair broken selectors when the repair can be proved, and open a pull request with the verified diff.
author: daronthedragon
branding:
  icon: git-pull-request
  color: green

inputs:
  command:
    description: 'demo | check | repair | drift'
    required: false
    default: check
  scrapers:
    description: Directory holding spec files.
    required: false
    default: scrapers
  fixtures:
    description: Directory holding golden snapshots.
    required: false
    default: fixtures
  config:
    description: Settings file.
    required: false
    default: ''
  write:
    description: On repair, persist verified selectors to the spec files.
    required: false
    default: 'false'
  model:
    description: Ask a model when the heuristics come up empty.
    required: false
    default: 'false'
  provider:
    description: 'anthropic | openai | gemini | ollama. Inferred from the environment if unset.'
    required: false
    default: ''
  api-key:
    description: API key for the chosen provider. Used only when `model` is true.
    required: false
    default: ''
  version:
    description: >-
      Git ref of mender to install. Defaults to the ref this action was called
      at, so `uses: owner/repo@v1.5.1` installs v1.5.1.
    required: false
    default: ''

outputs:
  status:
    description: 'ok | failing | repaired'
    value: ${{ steps.run.outputs.status }}
  report:
    description: Path to the pull-request body written by a successful repair.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install mender
      shell: bash
      env:
        # `github.action_ref` is the ref the caller pinned. Without this, a
        # consumer writing `@v1.5.1` would still get `main` installed, which is
        # the opposite of what pinning a version is for.
        REQUESTED: ${{ inputs.version }}
        CALLED_AT: ${{ github.action_ref }}
      run: |
        ref="${REQUESTED:-${CALLED_AT:-main}}"
        echo "installing mender from ref: $ref"
        # Installed from git rather than a registry: the package's `prepare`
        # script builds it on install, so nothing needs publishing.
        npm install --no-save "github:daronthedragon/mender#${ref}"

    - name: Run mender
      id: run
      shell: bash
      env:
        MENDER_API_KEY: ${{ inputs.api-key }}
        NO_COLOR: '1'
      run: |
        set +e

        # One input, routed to whichever variable the chosen provider reads.
        case "${{ inputs.provider }}" in
          openai) export OPENAI_API_KEY="$MENDER_API_KEY" ;;
          gemini) export GEMINI_API_KEY="$MENDER_API_KEY" ;;
          ollama) ;;
          *)      export ANTHROPIC_API_KEY="$MENDER_API_KEY" ;;
        esac

        args=("${{ inputs.command }}")

        if [ "${{ inputs.command }}" != "demo" ]; then
          args+=(--scrapers "${{ inputs.scrapers }}" --fixtures "${{ inputs.fixtures }}")
          [ -n "${{ inputs.config }}" ] && args+=(--config "${{ inputs.config }}")
          [ "${{ inputs.write }}" = "true" ] && args+=(--write)
          if [ "${{ inputs.model }}" = "true" ]; then
            args+=(--model)
            [ -n "${{ inputs.provider }}" ] && args+=(--provider "${{ inputs.provider }}")
          fi
          [ "${{ inputs.command }}" = "repair" ] && args+=(--pr-body mender-report.md)
        fi

        npx mender "${args[@]}"
        code=$?

        if [ "${{ inputs.command }}" = "repair" ] && [ -f mender-report.md ]; then
          echo "status=repaired" >> "$GITHUB_OUTPUT"
          echo "report=mender-report.md" >> "$GITHUB_OUTPUT"
        elif [ $code -eq 0 ]; then
          echo "status=ok" >> "$GITHUB_OUTPUT"
          echo "report=" >> "$GITHUB_OUTPUT"
        else
          echo "status=failing" >> "$GITHUB_OUTPUT"
          echo "report=" >> "$GITHUB_OUTPUT"
        fi
        exit $code
