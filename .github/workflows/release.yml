# Publishes to npm when a v* tag is pushed.
#
# Requires an NPM_TOKEN repository secret (an npm automation token). Without it
# the publish step is skipped rather than failing, so tagging a release still
# works for anyone installing straight from the git url.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `if:` cannot see env it sets itself.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: No token, no publish
        if: env.NPM_TOKEN == ''
        run: |
          echo "NPM_TOKEN is not set, so nothing was published."
          echo "The tag and GitHub release still stand; install with:"
          echo "  npm install github:daronthedragon/mender#${GITHUB_REF_NAME}"
